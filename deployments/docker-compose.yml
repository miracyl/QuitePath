services:
  db:
    build: 
      context: ..
      dockerfile: docker/database/Dockerfile
    container_name: quitepath-db
    environment:
      - POSTGRES_USER=POSTGRES
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${EXTERNAL_PORT}:${INTERNAL_PORT}"

  server:
    build: 
      context: ..
      dockerfile: docker/server/Dockerfile
    container_name: quitepath-server
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=POSTGRES
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  import-osm:
    image: pgrouting/pgrouting:16-3.5-3.8
    container_name: quitepath-import
    volumes: 
      - ../moscow_rich_data.osm:/data.osm
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    entrypoint: /bin/bash -c "apt-get update && apt-get install -y osm2pgrouting postgresql-client && PGPASSWORD=${POSTGRES_PASSWORD} osm2pgrouting -f /data.osm --conf /usr/share/osm2pgrouting/mapconfig.xml --dbname ${POSTGRES_DB} --host db --username POSTGRES --password ${POSTGRES_PASSWORD} --clean --attributes && psql -h db -U POSTGRES -d ${POSTGRES_DB} -c 'ALTER TABLE ways ADD COLUMN IF NOT EXISTS noise_factor FLOAT DEFAULT 1.0; ALTER TABLE ways ADD COLUMN IF NOT EXISTS green_factor FLOAT DEFAULT 1.0; ALTER TABLE ways ADD COLUMN IF NOT EXISTS quiet_cost FLOAT; UPDATE ways SET quiet_cost = length_m;'"
    depends_on:
      - db